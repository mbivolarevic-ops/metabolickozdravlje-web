name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Frontend se gradi nad JAVNIM `staging` datasetom. Vrednosti nisu tajne,
      # pa stoje kao repository variables. Ako upit padne, build mora pasti —
      # prazan rezultat se ne sme objaviti kao ispravan sajt.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ vars.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET: ${{ vars.NEXT_PUBLIC_SANITY_DATASET }}

      # Sanity Studio se ovde samo gradi, nikada ne objavljuje.
      # Project ID nije tajna, pa stoji kao repository variable, ne secret.
      - name: Studio build
        run: npm run studio:build
        env:
          SANITY_STUDIO_PROJECT_ID: ${{ vars.SANITY_STUDIO_PROJECT_ID }}

      # Generisani artefakti moraju odgovarati šemi i upitima u repozitorijumu.
      # Ako neko promeni šemu ili GROQ upit a ne regeneriše tipove, ovaj korak
      # pada na diff-u. Radi bez mreže — ekstrakcija čita lokalnu konfiguraciju.
      - name: TypeGen drift check
        run: npm run typegen:check
        env:
          SANITY_STUDIO_PROJECT_ID: ${{ vars.SANITY_STUDIO_PROJECT_ID }}
