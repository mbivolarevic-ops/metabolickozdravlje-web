name: CI

on:
  push:
    branches: [main]
  pull_request:

# Jedan run po grani. Nov push na istu granu čini prethodni run zastarelim —
# on više ne opisuje ništa što će biti mergovano.
#
# ⛔ `cancel-in-progress` je izraz, a ne `true`: prekidaju se SAMO runovi nad
# pull request-om. Run na `main` se nikada ne prekida — to je istorija grane
# koja je već mergovana, i required check koji za nju mora ostati zabeležen.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    # Ovaj job traje 74–97 sekundi. Podrazumevani limit je 6 sati, pa bi
    # zaglavljen korak držao runner sto puta duže nego što posao traje.
    # 15 minuta je oko desetostruko iznad izmerenog — dovoljno da spor mrežni
    # korak prođe, dovoljno kratko da kvar bude vidljiv isti čas.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Kapija za produkcione zavisnosti. Pada kada paket koji se ISPORUČUJE
      # korisniku ima poznatu `high` ili `critical` ranjivost.
      #
      # ⛔ `--omit=dev` nije kozmetika. Bez njega ista komanda danas izlazi sa 1,
      # jer dev stablo (`sanity` → `@sanity/cli`) nosi nalaze koje ne možemo da
      # zatvorimo — roditelji pinuju tačne verzije. Kapija koja je crvena od
      # prvog dana se ignoriše, a ignorisana kapija ne štiti ništa.
      #
      # Prag je `high` jer je to nivo na kojem zaustavljamo isporuku. Niži
      # pragovi bi mešali „mora sada" sa „vredi pogledati"; Dependabot i dalje
      # prijavljuje sve nivoe, uključujući dev-only nalaze.
      #
      # Bez `continue-on-error` i bez `|| true`: exit kod je jedini razlog
      # zbog kojeg ovaj korak postoji. Ne popravlja ništa — samo zaustavlja.
      - name: Production security audit
        run: npm audit --omit=dev --audit-level=high

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Frontend se gradi nad JAVNIM `staging` datasetom. Vrednosti nisu tajne,
      # pa stoje kao repository variables. Ako upit padne, build mora pasti —
      # prazan rezultat se ne sme objaviti kao ispravan sajt.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ vars.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET: ${{ vars.NEXT_PUBLIC_SANITY_DATASET }}

      # Sanity Studio se ovde samo gradi, nikada ne objavljuje.
      # Project ID nije tajna, pa stoji kao repository variable, ne secret.
      - name: Studio build
        run: npm run studio:build
        env:
          SANITY_STUDIO_PROJECT_ID: ${{ vars.SANITY_STUDIO_PROJECT_ID }}

      # Generisani artefakti moraju odgovarati šemi i upitima u repozitorijumu.
      # Ako neko promeni šemu ili GROQ upit a ne regeneriše tipove, ovaj korak
      # pada na diff-u. Radi bez mreže — ekstrakcija čita lokalnu konfiguraciju.
      - name: TypeGen drift check
        run: npm run typegen:check
        env:
          SANITY_STUDIO_PROJECT_ID: ${{ vars.SANITY_STUDIO_PROJECT_ID }}
